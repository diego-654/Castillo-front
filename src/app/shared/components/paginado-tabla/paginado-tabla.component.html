<div class="pagination">
  <div class="container">
    <button
      class="pagination-btn prev-btn"
      (click)="prevPage()"
      [disabled]="currentPage === 1"
    >
      <svg
        width="20"
        height="20"
        viewBox="0 0 20 20"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path
          d="M15.8346 9.99984H4.16797M4.16797 9.99984L10.0013 15.8332M4.16797 9.99984L10.0013 4.1665"
          stroke="#B6B5B4"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>

      <span>Anterior</span>
    </button>

    <div class="pagination-numbers">
      <span
        *ngFor="let page of getVisiblePages()"
        class="page-number"
        [ngClass]="{ active: currentPage === page, 'no-hover': page === '...' }"
        [class.active]="currentPage === page"
        (click)="onChangePage(page)"
      >
        <ng-container *ngIf="page === '...'">...</ng-container>
        <ng-container *ngIf="page !== '...'">{{ page }}</ng-container>
      </span>
    </div>

    <button
      class="pagination-btn next-btn"
      (click)="nextPage()"
      [disabled]="currentPage === totalPages"
    >
      <span>Siguiente</span>
      <svg
        width="20"
        height="20"
        viewBox="0 0 20 20"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path
          d="M4.16797 9.99984H15.8346M15.8346 9.99984L10.0013 4.1665M15.8346 9.99984L10.0013 15.8332"
          stroke="#817F7E"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </button>
  </div>
</div>
