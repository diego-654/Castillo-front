<div class="calendar">
  <div class="calendar-headline-controls">
    <div class="calendar-headline-month" (click)="handleMonthClick()">
      <div>{{ mesYanio() }}</div>
      <app-svg-icon path="assets/icons/calendar/arrow-1.svg" />
    </div>

    <div class="control left">
      <button (click)="goToPreviusMonth()">
        <app-svg-icon path="assets/icons/calendar/arrow-2.svg" />
      </button>
    </div>

    <div class="control right">
      <button (click)="goToNextMonth()">
        <app-svg-icon path="assets/icons/calendar/arrow-2.svg" />
      </button>
    </div>
  </div>

  <div class="calendar-body">
    <div class="week-header">
      <div class="day-header" *ngFor="let day of weekDays">{{ day }}</div>
    </div>

    <div class="grid">
      <div
        class="day"
        *ngFor="let day of days"
        (click)="toggleDay(day)"
        [ngClass]="{
          selected: internalValue()?.toDateString() === day.date.toDateString(),
          prev: day.prevOrNext === 'prev',
          next: day.prevOrNext === 'next',
          today: day.isToday
        }"
      >
        {{ day.date.getDate() | twoDigit }}
      </div>
    </div>
  </div>
</div>
