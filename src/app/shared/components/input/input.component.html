@if (label()) {
<div class="input-label">
  {{ label() }}
  @if(isRequired){
  <span class="required">*</span>
  }
</div>
}
<div
  class="input-wrapper"
  [ngClass]="[size(), type()]"
  [class.disabled]="disabled()"
  [class.readonly]="readonly()"
  (click)="handleWrapperClick()"
>
  <div class="prefix">
    <ng-content select="[prefix]"></ng-content>
  </div>

  @if(leftIcon()){
  <div class="prefix">
    <app-svg-icon [path]="leftIcon()!" class="icon"></app-svg-icon>
  </div>
  }

  <input
    #inputElement
    [placeholder]="placeholder()"
    [value]="internalValue()"
    (input)="handleInput($event)"
    (blur)="handleBlur()"
    [disabled]="disabled()"
    [name]="name()"
    [type]="modePassword() ? (passwordVisible() ? 'text' : 'password') : 'text'"
    [readonly]="readonly()"
    onwheel="this.blur()"
    (keydown)="keyPressed($event)"
    [attr.maxlength]="maxLength()"
  />
  <div class="sufix">
    <ng-content select="[sufix]"></ng-content>
  </div>

  @if(rightIcon()){
  <div class="sufix">
    <app-svg-icon [path]="rightIcon()!" class="icon"></app-svg-icon>
  </div>
  } @if (modePassword()) {
  <!-- añadir cursor pointer -->
  <div class="sufix" (click)="togglePasswordVisibility()" [style.cursor]="'pointer'">
    <app-svg-icon
      [path]="
        passwordVisible() ? 'assets/icons/visibility_off.svg' : 'assets/icons/visibility_on.svg'
      "
      class="icon"
    ></app-svg-icon>
  </div>
  }
</div>
<!--  -->
@if(errorMessage) {
<div class="error">
  {{ errorMessage }}
</div>
}
