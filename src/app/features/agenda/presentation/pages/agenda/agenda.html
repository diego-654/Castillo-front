<div class="container">
  <div class="left">
    <app-week-agenda (weekChange)="onWeekChange($event)"></app-week-agenda>
  </div>
  <div class="right">
    <app-day-picker
      [value]="null"
      [month]="month()"
      [year]="year()"
      [rangeStart]="start()"
      [rangeEnd]="end()"
    ></app-day-picker>
  </div>
</div>
